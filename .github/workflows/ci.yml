name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install ruff

      - name: Lint with ruff
        run: ruff check src tests

      - name: Secret scan check
        run: |
          # Prevent accidental commits of .env files or common key patterns
          test ! -f .env
          if grep -R "sk-" config/ docs/ src/ tests/; then
            echo "Potential secret-like string found. Review before committing."
            exit 1
          fi

      - name: Run tests
        run: pytest
