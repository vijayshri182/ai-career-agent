# Runtime settings that do not contain secrets
# Secrets should be injected via environment variables or vault.

api:
  host: 0.0.0.0
  port: 8000
  reload: false
  request_timeout_seconds: 30

frontend:
  url: http://localhost:3000

celery:
  broker_url: ${REDIS_URL}
  result_backend: ${REDIS_URL}
  task_serializer: json
  accept_content:
    - json
  task_track_started: true
  task_time_limit: 600
  worker_prefetch_multiplier: 1

scheduler:
  timezone: UTC
  beat_max_loop_interval: 60

logging:
  format: json
  level: INFO
  include_trace_id: true

feature_flags:
  enable_discovery: true
  enable_verification: true
  enable_matching: true
  enable_automation: false  # Keep false until Level 3 is explicitly approved
  enable_recruiter_discovery: false
  enable_outreach: false
