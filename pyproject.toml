[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-career-agent"
version = "0.1.0"
description = "24x7 AI-powered job search and application assistant"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Private"}
authors = [
    {name = "Vijay Shrivastava"}
]
keywords = ["ai", "career", "job-search", "automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "sqlmodel>=0.0.19,<0.1.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "celery>=5.4,<6.0",
    "redis>=5.0,<6.0",
    "playwright>=1.44,<2.0",
    "langchain>=0.2,<1.0",
    "langchain-openai>=0.1,<1.0",
    "langgraph>=0.0,<1.0",
    "pgvector>=0.2,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "PyYAML>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "pdfplumber>=0.11,<1.0",
    "python-docx>=1.1,<2.0",
    "passlib>=1.7,<2.0",
    "bcrypt>=4.0.1,<4.1",
    "sentry-sdk[fastapi]>=2.0,<3.0",
    "structlog>=24.1,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<4.0",
    "pip-audit>=2.7,<3.0",
    "freezegun>=1.5,<2.0",
    "factory-boy>=3.3,<4.0",
]

test = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "aiosqlite>=0.20,<1.0",
    "PyYAML>=6.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/vijayshri182/ai-career-agent"
Documentation = "https://github.com/vijayshri182/ai-career-agent/tree/main/docs"
Repository = "https://github.com/vijayshri182/ai-career-agent"
"Bug Tracker" = "https://github.com/vijayshri182/ai-career-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.hatch.version]
path = "src/backend/__init__.py"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
# B008: `Depends(...)`/`File(...)` in argument defaults is idiomatic FastAPI.
# UP042: str+mixin enums are idiomatic for FastAPI/Pydantic readable values.
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["migrations"]

# SQLModel/SQLAlchemy stubs expose native Python types on query
# attributes (e.g. `Model.status != enum`, `.order_by(Col.attr.desc())`),
# so a handful of codes are noise in the persistence layer.
[[tool.mypy.overrides]]
module = "backend.repositories.*"
disable_error_code = ["arg-type", "attr-defined", "call-overload", "type-arg"]

# FastAPI route handlers conventionally omit explicit return annotations
# (FastAPI resolves them from `response_model`/`status_code`).
[[tool.mypy.overrides]]
module = "backend.api.*"
disable_error_code = ["no-untyped-def"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "agent: marks tests that exercise agent logic",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
